[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eigenmind"
version = "0.2.0"
description = "Graph-based RAG over a Qdrant corpus, with Streamlit UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "streamlit",
    "qdrant-client",
    "sentence-transformers",
    "torch",
    "transformers",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyvis",
    "spacy",
    "nltk",
    "openpyxl",
    "chunknorris",
    "markitdown[pptx]",
    "requests",
    "python-dotenv",
    "scikit-learn",
    "wordcloud",
]

[project.optional-dependencies]
gdrive = ["google-api-python-client", "google-auth-httplib2", "google-auth-oauthlib"]
sharepoint = ["Office365-REST-Python-Client"]
dev = ["pytest", "ruff"]

[project.scripts]
eigenmind-ingest = "eigenmind.scripts.ingest_recursive:main"

[tool.setuptools.packages.find]
include = ["eigenmind*"]
exclude = ["legacy*", "tests*", "scripts*", "pages*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
