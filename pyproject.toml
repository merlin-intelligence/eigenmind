[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eigenmind"
version = "0.1.0"
description = "Eigenvalue-based graph computations for semantic chunk retrieval (similarity graph, spectral analysis, Lovász theta diversity)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Marion Schaeffer", email = "marion.schaeffer@merlin-intelligence.eu" },
]
keywords = ["graph", "eigenvalue", "spectral-clustering", "embeddings", "retrieval", "diversity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
viz = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/merlin-intelligence/eigenmind"
Repository = "https://github.com/merlin-intelligence/eigenmind"
Issues = "https://github.com/merlin-intelligence/eigenmind/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eigenmind = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM300", # array-vs-scalar comparisons (numpy idiom) misdetected as Yoda conditions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
