[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eigenmind"
version = "1.8.0"
description = "Eigenvalue-based graph computations for semantic selection: Spectral Attention, Semantic Bridges, Supported Diversity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "François Oustry", email = "francois.oustry@merlin-intelligence.eu" },
    { name = "Marion Schaeffer", email = "marion.schaeffer@merlin-intelligence.eu" },
]
keywords = [
    "graph",
    "eigenvalue",
    "spectral-attention",
    "semantic-bridges",
    "supported-diversity",
    "embeddings",
    "retrieval",
    "diversity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
viz = ["matplotlib"]

[project.scripts]
eigenmind-spectral = "eigenmind.spectral_attention:main"
eigenmind-bridges = "eigenmind.semantic_bridges:main"
eigenmind-diversity = "eigenmind.supported_diversity:main"
eigenmind-scale-check = "eigenmind.scale_check:main"

[project.urls]
Homepage = "https://github.com/merlin-intelligence/eigenmind"
Repository = "https://github.com/merlin-intelligence/eigenmind"
Issues = "https://github.com/merlin-intelligence/eigenmind/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eigenmind = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM300", # array-vs-scalar comparisons (numpy idiom) misdetected as Yoda conditions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
